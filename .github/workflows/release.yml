# Makes a GitHub Release when a version tag (v1.0.0, ...) is pushed, with one zip per skill attached.
# Each zip holds the skill's folder at its root, so `unzip <skill>.zip -d ~/.claude/skills` installs it.
# The newest release serves https://github.com/glidezo/skills/releases/latest/download/<skill>.zip
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Zip each skill
        run: |
          set -euo pipefail
          mkdir -p dist
          cd skills
          for dir in */; do
            slug=${dir%/}
            test -f "$slug/SKILL.md"
            find "$slug" -type f | LC_ALL=C sort | zip -X -q "../dist/$slug.zip" -@
          done
          ls -l ../dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "$GITHUB_REF_NAME" --notes "One zip per skill. Unzip one into your agent's skills folder, for example ~/.claude/skills or ~/.agents/skills. Made by Glidezo, more skills at https://glidezo.com/skills"
